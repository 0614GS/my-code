source_roots = ["src"]
exclude = ["**/*__pycache__", "**/*egg-info", "**/docs", "**/tests", "**/venv"]
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
include_string_imports = true
root_module = "dependenciesonly"

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

[[modules]]
path = "<root>"
depends_on = ["my_code.version"]

[[modules]]
path = "my_code.version"
depends_on = []

[[modules]]
path = "my_code.foundation"
depends_on = []

[[modules]]
path = "my_code.model"
depends_on = ["my_code.foundation"]

[[modules]]
path = "my_code.workspace"
depends_on = []

[[modules]]
path = "my_code.permissions"
