[[modules]]
path = "my_code.prompts"
depends_on = ["my_code.model"]

[[modules]]
path = "my_code.auth"
depends_on = ["my_code.model"]

[[modules]]
path = "my_code.config"
depends_on = ["my_code.auth", "my_code.model", "my_code.permissions"]

[[modules]]
path = "my_code.conversation"
depends_on = ["my_code.foundation", "my_code.model"]

[[modules]]
