[project]
name = "nano-code"
version = "0.1.0"
description = "A small, educational coding agent inspired by Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0,<0.122.0",
    "openai>=2,<3",
    "textual>=8.2.8,<9.0.0",
    "tree-sitter>=0.26.0,<0.27.0",
    "tree-sitter-bash>=0.25.1,<0.26.0",
]

[project.scripts]
nanocode = "nano_code.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
