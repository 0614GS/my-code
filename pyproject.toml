[project]
name = "my-code"
version = "0.1.0"
description = "A modular, glass-box coding agent—inspect exactly what your agent sends to the model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0,<0.122.0",
    "openai>=2,<3",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "prompt-toolkit>=3.0.52,<4.0.0",
    "rich>=15.0.0,<16.0.0",
    "tree-sitter>=0.26.0,<0.27.0",
    "tree-sitter-bash>=0.25.1,<0.26.0",
]

[project.scripts]
mycode = "my_code.bootstrap:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "ruff>=0.12.0",
    "tach>=0.35.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF100"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [".venv", "claude-code"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-q -p no:tach --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
